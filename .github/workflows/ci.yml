name: suite-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python entrypoints
        run: python -m compileall -q scripts infra tests
      - name: Run unit tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q
      - name: Validate curated evidence and public paths
        run: python scripts/reporting/validate_publication.py
      - name: Render dashboard in a clean environment
        env:
          VIRTUALV_DASHBOARD_OUT: /tmp/virtualv-dashboard.html
          VIRTUALV_DASHBOARD_CREATED: CI validation build
          VIRTUALV_DISK_FREE_GB: '0'
        run: |
          python scripts/benchmarks/build_dual_v100_html.py
          test -s /tmp/virtualv-dashboard.html
          grep -q 'Bekende benchmarks' /tmp/virtualv-dashboard.html
